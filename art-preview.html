<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>精灵美术预览</title>
<style>
  body { margin: 0; background: #0a0a0a; font-family: 'Courier New', monospace; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 12px; max-width: 760px; }
  .cell { background: radial-gradient(circle at 50% 60%, #16200f, #0a0f0a 70%); border: 1px solid #306230; padding: 8px 4px; text-align: center; }
  .cell canvas { width: 200px; height: 200px; image-rendering: pixelated; display: block; margin: 0 auto; }
  .name { color: #9bbc0f; font-size: 13px; margin-top: 6px; }
  .meta { color: #6b7f3a; font-size: 10px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
  import { SPRITES } from './js/config.js';
  import { createPetCanvas } from './js/sprites.js';

  const grid = document.getElementById('grid');
  for (const def of Object.values(SPRITES)) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.appendChild(createPetCanvas({
      shape: def.shape, bodyColor: def.bodyColor, shadowColor: def.shadowColor, evolved: false,
    }));
    const n = document.createElement('div'); n.className = 'name'; n.textContent = def.name;
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = def.shape;
    cell.append(n, m);
    grid.appendChild(cell);
  }
</script>
</body>
</html>
